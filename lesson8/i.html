<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <button onclick="game('heads')">heads</button>
<button onclick="game('tails')">tails</button>
<script>
function game(guess) {
    let random = Math.random();
    let result;

    if (random < 0.5) {
        result = 'heads';
    } else {
        result = 'tails';
    }

    if (guess === result) {
        alert('You win!');
    } else {
        alert('You lose!');
    }
}
</script>
