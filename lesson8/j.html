<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <button onclick="game('heads')">heads</button>
<button onclick="game('tails')">tails</button>
<script>
function game(guess) {
    let random = Math.random();
    let result;
    const score={
        win:0,
        lose:0
    }
    if (random < 0.5) {
        result = 'heads';
    } else {
        result = 'tails';
    }

    if (guess === result) {
       score.win+=1
    } else {
        score.lose+=1
    }

    
}
</script>
</body>
