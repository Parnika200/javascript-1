<!DOCTYPE html>
<html>
<body>

    <input class="cost" type="text">
    <button onclick="calculate()">Calculate</button>

    <p class="res"></p>

    <script>
        function calculate() {
            const cost = Number(document.querySelector('.cost').value)

            const total = cost + 10

            document.querySelector('.res').innerHTML = `$${total.toFixed(2)}`
        }
    </script>

</body>
</html>
