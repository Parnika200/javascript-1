<body>
    <button onclick="h()" class="head">head</button>
    <button onclick="t()" class="tails">tails</button>
    <p class="p"></p>

     function h(){
        const h=document.querySelector('.head').innerHTML
        document.querySelector('.p').innerHTML=`u select ${h}`

        function t() {
            const t = document.querySelector('.tails').innerHTML;
            document.querySelector('.p').innerHTML = `u select ${t}`;
        }
    </script>
