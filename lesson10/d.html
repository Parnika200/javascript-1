<!DOCTYPE html>
<html lang="en">
<head>
   <style>
     .button{
        background-color: black;
        border: none;
        border-radius: 10px;
        color: white;
        width:100px;
        height:40px
    }

     .active{
          background-color: rgb(221, 221, 221);
        color:black
    }


   </style>
</head>
<body>
    <button onclick="fun()" class="button js">Gaming</button>

    <script>
        function fun(){
            const b=document.querySelector(".js")
            b.classList.add('active')
        }
    </script>
</body>
</html>
