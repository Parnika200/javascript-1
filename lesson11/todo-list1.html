<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>

    <input type="text" class="in" placeholder="todo item">
    <button onclick="add()">ADD</button>

    <script>

        const arr = [];

        function add() {

            const i = document.querySelector(".in");
            const text = i.value;

            arr.push(text);

            for (let i in arr) {
                document.querySelector("body").innerHTML +=
                    `<p>${arr[i]}</p>`;
            }
        }

    </script>

</body>
</html>
