<body> 
    <button onclick=" 
        const randomnum=Math.random() 
        let computer='' 
        if(randomnum>=0 && randomnum<=1/3){ 
            computer='rock' 
        } 
        else if(randomnum>=1/3 && randomnum<=2/3){ 
            computer='paper' 
        } 
        else if(randomnum>=2/3 && randomnum<=1){ 
            computer='scissors' 
        } 
 
        let result ='' 
        if(computer=='rock'){ 
            result='tie' 
        } 
        else if(computer=='paper'){ 
            result='lose' 
        } 
        else if(computer=='scissors'){ 
            result='win' 
        } 
 
        alert(`u picked rock, computer picker ${computer} , result=${result}`) 
        ">Rock</button>
