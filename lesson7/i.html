<body>
    <script>
function convert(length, from, to) {
    
    if(from!=="km" || from!=="ft" || from!=="miles"){
        return "invalid unit"
    }

    if(to!=="km" || to!=="ft" || to!=="miles"){

         return "invalid unit"
    }
    if (from === 'miles' && to === 'km') {
        return `${length * 1.6} km`;
    }

    if (from === 'km' && to === 'miles') {
        return `${length / 1.6} miles`;
    }

    if (from === 'miles' && to === 'ft') {
        return `${length * 5280} ft`;
    }

    if (from === 'km' && to === 'ft') {
        return `${length * 3281} ft`;
    }

    if (from === 'ft' && to === 'miles') {
        return `${length / 5280} miles`;
    }

    if (from === 'ft' && to === 'km') {
        return `${length / 3281} km`;
    }
}

console.log(convert(5, 'miles', 'km'));

    </script>
</body>
