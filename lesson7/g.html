    <script>

function convert(length, from, to) {
   

    if (from === 'miles' && to === 'km') {
        return `${length * 1.6} km`;
    }

    if (from === 'km' && to === 'miles') {
        return `${length / 1.6} miles`;
    }
}

console.log(convert(50, 'miles', 'km'));

    </script>
